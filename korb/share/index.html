<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Die einfache Einkaufsliste</title>
<!--
  The share page of Die einfache Einkaufsliste (code name Korb). Published at https://habboubah.github.io/privacy-policy/korb/share/
  (copy this file to korb/share/index.html in the privacy-policy repo).

  The list itself is in the link after the "#" (see src/share.ts). Browsers
  never send that part to a server, so GitHub Pages only ever serves this
  empty page; the list is read and shown here, on the receiver's phone.
  Everything from the link is rendered as text (textContent), never as HTML.
-->
<style>
  :root {
    --bg: #F6F6F3; --surface: #FFFFFF; --surface-2: #EEEFEB; --hairline: #E4E4DF;
    --fg: #141714; --mute: #5B605B; --faint: #6B706A; --accent: #1E6A45; --accent-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1110; --surface: #181B19; --surface-2: #232724; --hairline: #2E332F;
      --fg: #F1F2EE; --mute: #B0B5AF; --faint: #949990; --accent: #7FD3A0; --accent-ink: #0D1A12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px calc(140px + env(safe-area-inset-bottom)); }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 0 4px 18px; }
  [dir="rtl"] .brand { letter-spacing: 0; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .tile { width: 60px; height: 60px; border-radius: 18px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 34px; flex-shrink: 0; }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  [dir="rtl"] h1 { letter-spacing: 0; line-height: 1.3; }
  .sub { margin: 4px 0 0; font-size: 15px; color: var(--mute); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; }
  li + li { border-top: 1px solid var(--hairline); }
  .em { width: 28px; text-align: center; font-size: 22px; flex-shrink: 0; }
  .name { flex: 1; min-width: 0; font-size: 17px; overflow-wrap: anywhere; }
  .note { display: block; font-size: 13px; color: var(--mute); }
  .qty { flex-shrink: 0; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); direction: ltr; font-variant-numeric: tabular-nums; }
  li.done .name { color: var(--faint); text-decoration: line-through; }
  li.done .em { opacity: .45; }
  .label { margin: 22px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  [dir="rtl"] .label { letter-spacing: 0; }
  .hint { margin: 18px 4px 0; font-size: 14px; color: var(--mute); }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 28px 16px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
  .dock > div { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 18px; border: 0; font: inherit; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { background: var(--surface-2); color: var(--fg); min-height: 48px; font-size: 15px; }
  .empty { text-align: center; padding: 64px 12px; color: var(--mute); }
  .empty .tile { margin: 0 auto 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="brand"><span aria-hidden="true">🧺</span> <span id="brand">Die einfache Einkaufsliste</span></p>

  <section id="list" hidden>
    <div class="head">
      <div class="tile" id="emoji" aria-hidden="true"></div>
      <div>
        <h1 id="name"></h1>
        <p class="sub" id="count"></p>
      </div>
    </div>
    <ul id="open"></ul>
    <p class="label" id="doneLabel" hidden></p>
    <ul id="done" hidden></ul>
    <p class="hint" id="hint"></p>
  </section>

  <section id="invalid" class="empty" hidden>
    <div class="tile" aria-hidden="true">🧺</div>
    <p id="invalidText"></p>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <div>
    <a class="btn primary" id="open-app"></a>
    <button class="btn secondary" id="copy" type="button"></button>
  </div>
</div>

<script>
(function () {
  var T = {
    de: { brand: 'Die einfache Einkaufsliste', title: 'Geteilte Einkaufsliste', count: '{n} Artikel', open: 'In der App öffnen', copy: 'Liste kopieren', copied: 'Kopiert ✓',
          inBasket: 'Schon im Korb', hint: '„In der App öffnen“ speichert die Liste als Kopie in der App. Die Liste steckt im Link selbst – sie wurde an keinen Server geschickt.',
          invalid: 'Dieser Link enthält keine Liste. Vielleicht wurde er beim Kopieren abgeschnitten?',
          units: { pcs: 'Stk', kg: 'kg', g: 'g', l: 'l', ml: 'ml', pack: 'Pck' }, locale: 'de-DE' },
    en: { brand: 'The Simple Shopping List', title: 'Shared shopping list', count: '{n} items', open: 'Open in the app', copy: 'Copy list', copied: 'Copied ✓',
          inBasket: 'Already in the basket', hint: '“Open in the app” saves the list as a copy in the app. The list is inside the link itself – it was not sent to any server.',
          invalid: 'This link has no list in it. Perhaps it was cut off when it was copied?',
          units: { pcs: 'pcs', kg: 'kg', g: 'g', l: 'l', ml: 'ml', pack: 'pack' }, locale: 'en-GB' },
    ar: { brand: 'قائمة التسوق البسيطة', title: 'قائمة مشتريات مُشارَكة', count: 'عدد الأغراض: {n}', open: 'افتح في التطبيق', copy: 'نسخ القائمة', copied: 'تم النسخ ✓',
          inBasket: 'في السلة', hint: '«افتح في التطبيق» يحفظ نسخة من القائمة في التطبيق. القائمة موجودة داخل الرابط نفسه – ولم تُرسل إلى أي خادم.',
          invalid: 'هذا الرابط لا يحتوي على قائمة. ربما انقطع عند نسخه؟',
          units: { pcs: 'حبة', kg: 'كغ', g: 'غ', l: 'ل', ml: 'مل', pack: 'علبة' }, locale: 'ar-u-nu-latn' }
  };
  var lang = (navigator.language || 'de').slice(0, 2);
  var t = T[lang] || T.de;
  document.documentElement.lang = T[lang] ? lang : 'de';
  if (lang === 'ar') document.documentElement.dir = 'rtl';
  var $ = function (id) { return document.getElementById(id); };
  $('brand').textContent = t.brand;
  document.title = t.brand;
  var fmt = function (s, n) { return s.replace('{n}', String(n)); };

  // Same format as src/share.ts: "1." + base64url(UTF-8 JSON).
  function decode(hash) {
    var p = decodeURIComponent(hash.replace(/^#/, ''));
    if (!/^1\.[A-Za-z0-9_-]+$/.test(p) || p.length > 60000) return null;
    try {
      var b64 = p.slice(2).replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var w = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
      if (!w || w.v !== 1 || typeof w.n !== 'string' || !Array.isArray(w.i)) return null;
      var str = function (v, max) { return typeof v === 'string' && v.trim() ? v.slice(0, max) : ''; };
      var items = w.i.slice(0, 300).filter(function (x) { return x && str(x.n, 80); }).map(function (x) {
        return { n: str(x.n, 80), e: str(x.e, 16), o: str(x.o, 200), q: typeof x.q === 'number' && x.q > 0 && x.q < 100000 ? x.q : 0,
                 u: t.units.hasOwnProperty(x.u) ? x.u : '', d: x.d === 1 };
      });
      return { payload: p, name: str(w.n, 60), emoji: str(w.e, 16) || '🧺', items: items };
    } catch (e) { return null; }
  }

  function qty(it) {
    if (!it.q) return '';
    var n = new Intl.NumberFormat(t.locale, { maximumFractionDigits: 2 }).format(it.q);
    if (!it.u || it.u === 'pcs') return it.q === 1 ? '' : n + '×';
    return n + ' ' + t.units[it.u];
  }

  function row(it) {
    var li = document.createElement('li');
    if (it.d) li.className = 'done';
    var em = document.createElement('span'); em.className = 'em'; em.setAttribute('aria-hidden', 'true'); em.textContent = it.e || '•';
    var name = document.createElement('span'); name.className = 'name'; name.textContent = it.n;
    if (it.o) { var note = document.createElement('span'); note.className = 'note'; note.textContent = it.o; name.appendChild(note); }
    li.appendChild(em); li.appendChild(name);
    var q = qty(it);
    if (q) { var b = document.createElement('span'); b.className = 'qty'; b.textContent = q; li.appendChild(b); }
    return li;
  }

  var list = decode(location.hash || '');
  document.title = (list ? list.name + ' – ' : '') + t.title;
  if (!list) { $('invalidText').textContent = t.invalid; $('invalid').hidden = false; return; }

  $('emoji').textContent = list.emoji;
  $('name').textContent = list.name;
  $('count').textContent = fmt(t.count, list.items.length);
  var open = list.items.filter(function (i) { return !i.d; }), done = list.items.filter(function (i) { return i.d; });
  open.forEach(function (i) { $('open').appendChild(row(i)); });
  if (!open.length) $('open').hidden = true;
  if (done.length) {
    $('doneLabel').textContent = t.inBasket + ' · ' + done.length; $('doneLabel').hidden = false;
    done.forEach(function (i) { $('done').appendChild(row(i)); }); $('done').hidden = false;
  }
  $('hint').textContent = t.hint;
  $('list').hidden = false;

  var app = $('open-app');
  app.textContent = t.open;
  app.href = 'korb://share#' + list.payload;

  var copy = $('copy');
  copy.textContent = t.copy;
  copy.addEventListener('click', function () {
    var text = [list.name, ''].concat(open.concat(done).map(function (i) {
      var q = qty(i); return (i.d ? '✓ ' : '• ') + (q ? q + ' ' : '') + i.n + (i.o ? ' (' + i.o + ')' : '');
    })).join('\n');
    var ok = function () { copy.textContent = t.copied; setTimeout(function () { copy.textContent = t.copy; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, function () {});
  });
  $('dock').hidden = false;
})();
</script>
</body>
</html>
